<VirtualHost *:80>
    # Define o diretório raiz da aplicação Laravel como 'public'
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # Garante que o mod_rewrite e .htaccess sejam respeitados
        AllowOverride All
        Require all granted
    </Directory>

    # Configurações de log (opcional, mas bom para debug)
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
