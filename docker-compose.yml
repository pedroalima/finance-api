services:
    app:
        build: .
        container_name: finance-app
        ports:
            - "8080:80"
        volumes:
            - .:/var/www/html
        depends_on:
            - mysql
        extra_hosts:
            - "host.docker.internal:host-gateway"

    mysql:
        image: mysql:8.0
        container_name: finance-db
        environment:
            MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
            MYSQL_DATABASE: finance
        ports:
            - "3306:3306"
        volumes:
            - mysql_data:/var/lib/mysql

volumes:
    mysql_data:
